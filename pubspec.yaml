name: ksm_otp_receiver
description: Private email OTP receiver for mailboxes you own.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  enough_mail: ^3.0.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  workmanager: ^0.10.0
  flutter_local_notifications: ^22.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
